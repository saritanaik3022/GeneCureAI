version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: genecure-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - EXECUTION_MODE=DEMO_MODE
      - DATABASE_URL=postgresql+asyncpg://genecure_user:genecure_pass@db:5432/genecure_db
      - ALLOWED_ORIGINS=["http://localhost:5173", "http://localhost:3000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./ml/models:/app/ml/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genecure-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: genecure-postgres
    environment:
      POSTGRES_USER: genecure_user
      POSTGRES_PASSWORD: genecure_pass
      POSTGRES_DB: genecure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genecure_user -d genecure_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
